name: TripTrail
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
targets:
  TripTrail:
    type: application
    platform: iOS
    sources:
      - path: TripTrail
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.TripTrail
        PRODUCT_NAME: TripTrail
        PRODUCT_MODULE_NAME: TripTrail
        INFOPLIST_FILE: TripTrail/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9RRH48X8ZP
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    dependencies:
      - sdk: Photos.framework
      - sdk: PhotosUI.framework
      - sdk: AVKit.framework
      - sdk: MapKit.framework
      - sdk: Vision.framework
      - sdk: Security.framework
  TripTrailTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TripTrailTests
    dependencies:
      - target: TripTrail
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.TripTrailTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TripTrail:
    build:
      targets:
        TripTrail: all
        TripTrailTests: [test]
    test:
      targets:
        - TripTrailTests
